name: Deploy storefront to Hostinger

on:
  push:
    branches: [main]
    paths:
      - "store-frontend/**"
      - ".github/workflows/deploy-storefront.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: store-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: store-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (includes sitemap prebuild)
        run: npm run build

      - name: Deploy via FTP
        if: ${{ secrets.HOSTINGER_FTP_HOST != '' && secrets.HOSTINGER_FTP_USER != '' && secrets.HOSTINGER_FTP_PASSWORD != '' }}
        env:
          HOSTINGER_FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          HOSTINGER_FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_FTP_REMOTE_DIR: ${{ secrets.HOSTINGER_FTP_REMOTE_DIR }}
        run: npm run deploy:hostinger:upload

      - name: Skip deploy (secrets missing)
        if: ${{ secrets.HOSTINGER_FTP_HOST == '' || secrets.HOSTINGER_FTP_USER == '' || secrets.HOSTINGER_FTP_PASSWORD == '' }}
        run: echo "HOSTINGER_FTP_* secrets not set — build only. Add secrets to enable FTP deploy."
